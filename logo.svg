<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <!-- Vibrant Neon Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="50%" stop-color="#9A00FF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Strong Multi-layer Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Outer soft spread -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur2" />
      
      <!-- Intense core glow -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur3" />
      
      <!-- Merge glows together with original graphic -->
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="blur3" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Dark Background to Make the Gradient Glow Pop -->
  <rect width="100%" height="100%" fill="#0a0a0c" />

  <!-- Fluid & Expressive Script MPL Wordmark with Gradient and Glow -->
  <g fill="none" stroke="url(#neonGradient)" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)">
    
    <!-- Letter M with flowing entry and ligature into P -->
    <path stroke-width="16" d="
      M 155 182
      C 150 155, 195 130, 222 142
      C 238 150, 212 215, 196 242
      C 214 205, 255 148, 282 152
      C 298 154, 275 212, 260 238
      C 278 202, 315 156, 338 160
      C 352 162, 326 225, 336 242
      C 348 260, 392 222, 422 175
    " />

    <!-- Letter P with expressive descender loop and bowl -->
    <path stroke-width="16" d="
      M 426 168
      C 406 218, 378 278, 342 292
      C 324 298, 314 286, 320 274
    " />
    <path stroke-width="15" d="
      M 388 182
      C 412 142, 478 135, 496 164
      C 512 190, 472 222, 412 222
    " />

    <!-- Letter L with sweeping ascender loop and tail -->
    <path stroke-width="16" d="
      M 484 202
      C 528 202, 578 175, 588 148
      C 596 128, 576 124, 560 144
      C 538 172, 514 235, 482 252
      C 458 264, 444 250, 452 236
      C 462 220, 496 228, 548 248
      C 592 265, 632 272, 650 256
    " />
  </g>
</svg>
